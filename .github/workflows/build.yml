name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tools/tests -v
      - name: Check generated themes are up to date
        run: python tools/generate.py --check

  vsix:
    needs: generate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - name: Build
        run: msbuild ZenbonesTheme.sln /restore /p:Configuration=Release /v:minimal
      - name: Test
        run: dotnet test src/ZenbonesTheme.Tests/ZenbonesTheme.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v7
        with:
          name: ZenbonesTheme.vsix
          path: src/ZenbonesTheme/bin/Release/ZenbonesTheme.vsix
          if-no-files-found: error

  # Pushing a v* tag publishes that build to GitHub Releases and the
  # Visual Studio Marketplace. The token lives in the "marketplace"
  # environment, which can require approval before this job runs.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: vsix
    runs-on: windows-latest
    environment: marketplace
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ZenbonesTheme.vsix
      - name: Check the tag matches the manifest version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content src/ZenbonesTheme/source.extension.vsixmanifest
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match manifest version $version"
          }
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME ZenbonesTheme.vsix --title $env:GITHUB_REF_NAME --generate-notes
      - name: Publish to the Visual Studio Marketplace
        shell: pwsh
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          # VsixPublisher ships in the same VSSDK build tools package the project builds with.
          $package = "$env:RUNNER_TEMP\vssdk"
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.VSSDK.BuildTools/17.14.2120 -OutFile "$package.zip"
          Expand-Archive "$package.zip" $package
          & "$package\tools\vssdk\bin\VsixPublisher.exe" publish `
            -payload ZenbonesTheme.vsix `
            -publishManifest marketplace/publishManifest.json `
            -personalAccessToken $env:VS_MARKETPLACE_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher failed with exit code $LASTEXITCODE" }
