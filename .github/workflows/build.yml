name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only unless a job asks for more (only release does).
permissions:
  contents: read

# A newer push to a PR cancels its older run; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tools/tests -v
      - name: Check generated themes are up to date
        run: python tools/generate.py --check

  vsix:
    needs: generate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        run: msbuild ZenbonesTheme.sln /restore /p:Configuration=Release /v:minimal
      - name: Test
        run: dotnet test src/ZenbonesTheme.Tests/ZenbonesTheme.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v7
        with:
          name: ZenbonesTheme.vsix
          path: src/ZenbonesTheme/bin/Release/ZenbonesTheme.vsix
          if-no-files-found: error

  # Pushing a v* tag attaches that build to a GitHub release, which is then
  # uploaded to the Visual Studio Marketplace by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ZenbonesTheme.vsix
      - name: Check the tag matches the manifest version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; ns = '{http://schemas.microsoft.com/developer/vsx-schema/2011}'; print(ET.parse('src/ZenbonesTheme/source.extension.vsixmanifest').find(f'{ns}Metadata/{ns}Identity').get('Version'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ZenbonesTheme.vsix --title "$GITHUB_REF_NAME" --generate-notes
